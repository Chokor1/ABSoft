<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ABSoft POS</title>
    <meta name="author" content="Abbass Chokor" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/img/logo-mark.svg" />
    <link rel="apple-touch-icon" href="/img/logo-mark.svg" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div id="app" class="app-loading">
      <div class="boot">
        <div class="boot-mark"><img src="/img/logo-mark.svg" alt="ABSoft" /></div>
        <div class="boot-text">Starting ABSoft POS…</div>
      </div>
    </div>
    <!-- Only on paper: the shop's letterhead and the line at the foot of the page. -->
    <div id="print-head" class="print-only"></div>
    <div id="print-foot" class="print-only"></div>
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
    <div id="modal-root"></div>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
